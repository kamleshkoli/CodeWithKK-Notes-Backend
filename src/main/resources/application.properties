spring.application.name=backend
server.port=${PORT:8080}

# MySQL - credentials come from the URL itself (works locally + on Render)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://root:@localhost:3306/codewithkk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart file upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local file upload directory (fallback if Cloudinary is not configured)
app.upload.dir=uploads/pdfs

# JWT signing secret. The default is DEV ONLY and is public in git history -
# always set JWT_SECRET in production or anyone can forge an admin token.
app.jwt.secret=${JWT_SECRET:codewithkkbackendprojectjwtsecretkeyforauthentication123456}

# Comma-separated list of allowed browser origins. Default "*" keeps local dev
# simple; set this to your real frontend domain before going live.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cloudinary (for production - set these env vars on Render)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Razorpay (set your credentials - env vars on Render)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
