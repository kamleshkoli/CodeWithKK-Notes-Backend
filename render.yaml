services:
  - type: web
    name: kk-bank-backend
    runtime: docker
    plan: free
    dockerContext: .
    envVars:
      - key: MYSQL_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated list of allowed browser origins, e.g.
      # https://your-app.vercel.app . Falls back to "*" if unset.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
